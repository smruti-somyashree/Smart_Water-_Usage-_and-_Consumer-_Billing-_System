spring:
  datasource:
    url: "jdbc:h2:file:./data/smartwater;MODE=PostgreSQL;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1"
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: true
    clean-on-validation-error: true
server:
  port: 8082
app.jwt:
  secret: "smart-water-demo-secret-must-be-at-least-32-characters-long"
  access-minutes: 30
  refresh-days: 7
