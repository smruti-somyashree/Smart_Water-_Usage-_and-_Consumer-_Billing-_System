spring:
  datasource: { url: "jdbc:h2:mem:smartwater;MODE=PostgreSQL;DB_CLOSE_DELAY=-1", username: sa, password: "" }
  jpa: { hibernate: { ddl-auto: validate } }
  flyway: { enabled: true }
  mail: { host: localhost, port: 1025 }
app.jwt: { secret: "smart-water-demo-secret-must-be-at-least-32-characters-long", access-minutes: 30, refresh-days: 7 }
app.alerts: { interval-ms: 99999999 }
